schema: spec-driven

context: |
  rls 是多分支、多技术栈发布 CLI，使用 Rust，已实现分层消息配置、模板渲染与 message CLI。
  产品需求、架构边界与实施顺序见 openspec/project.md。
  首期 git-tag 后端：plan 保存不可变计划，run 执行并记录，message 从记录渲染消息。
  仓库配置读取 <git-common-dir>/rls/config.toml，全局目录支持 RLS_CONFIG_HOME 覆盖。
  message.version 独立标记消息格式，省略兼容 v1；各层先校验版本再合并，未知版本报错。
  消息字段按仓库、全局、内置默认值解析；变量按键合并，模板相对路径保留声明来源。
  不切换用户分支，不自动覆盖或强推 tag，不自动发送聊天消息。
  plan/run 和发布后端尚未实现；message 读取版本化 JSON 记录，支持终端、文件、剪贴板。
  tests/features/*.feature 使用中文 Gherkin；步骤在 tests/acceptance.rs 与 tests/support/。
  配置示例 smoke 不等同于发布功能验收。发布集成测试使用临时仓库与本地 bare remote。
  文档以中文为主，标识符使用英文。保留 OpenSpec 要求的 Requirement、Scenario、SHALL 等语法。

rules:
  proposal:
    - 明确对应的产品目标范围、非目标与可观察的行为变化。
  specs:
    - 每项需求提供可验证的 WHEN/THEN 场景；区分已实现行为与目标行为。
    - 为新增行为规划对应的 Cucumber 场景，不将未实现步骤作为通过的验收。
  tasks:
    - 包含相关 Gherkin 场景、步骤实现及 cargo test --locked --test acceptance 验证。
    - 涉及发布动作时覆盖实际本地 bare remote 的引用与工作区状态。
