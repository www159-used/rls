[package]
name = "rls"
version = "0.1.1"
edition = "2024"
rust-version = "1.95"
publish = false
license = "AGPL-3.0-only"
description = "Configurable release messages for multi-branch projects"

[dev-dependencies]
cucumber = "0.23"
futures = "0.3"
tempfile = "3.27.0"
toml = "0.9"

[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
harness = false

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.7.0", default-features = false }
clap = { version = "4.6.7", features = ["derive"] }
directories = "6"
minijinja = "2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "0.9"

serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
